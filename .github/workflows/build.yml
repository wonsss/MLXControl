name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: |
          brew install swiftlint --quiet
          swiftlint --strict
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
